[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "UMAP_RGB"
version = "1.0.1"
description = "UMAP_RGB."
readme = "README.md"

requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy<2",
    "imageio[ffmpeg]",
    "joblib",
    "matplotlib",
    "torch",
    "torchvision",
    "numba",
    "scikit_learn",
    "seaborn",
    "tqdm",
    "umap-learn",
]

authors = [
  { name = "Nolan Heffner", email = "nolan.heffner2@gmail.com" },
]
